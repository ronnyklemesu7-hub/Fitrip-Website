<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freeweight Floor Gallery — FITRIP FITNESS CLUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --charcoal: #141414;
            --red: #FF1A1A;
            --gold: #E5B829;
            --white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--black);
            color: var(--white);
            margin: 0;
            padding: 0;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(180deg, var(--charcoal), var(--black));
        }

        .header h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(40px, 6vw, 64px);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 10px;
            color: var(--white);
        }

        .header h1 span {
            background: linear-gradient(135deg, var(--red) 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: #aaa;
            font-size: 16px;
            margin: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px 5vw;
            max-width: 1300px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.5s ease;
            filter: grayscale(30%);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        .gallery-item::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
        }

        .nav-back {
            position: absolute;
            top: 24px;
            left: 30px;
        }

        .nav-back a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--white);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            opacity: 0.75;
        }

        .nav-back a:hover {
            color: var(--gold);
            opacity: 1;
        }

        /* LIGHTBOX */
        .lb-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .3s ease;
            pointer-events: none;
            z-index: 2;
        }

        .lb-hint svg {
            width: 40px;
            height: 40px;
            color: #fff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .7));
        }

        .gallery-item:hover .lb-hint {
            opacity: 1;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .92);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
        }

        #lightbox.open {
            opacity: 1;
            pointer-events: all;
        }

        #lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .8);
            transform: scale(.93);
            transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
        }

        #lightbox.open img {
            transform: scale(1);
        }

        #lb-caption {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: #ccc;
            font-size: 13px;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 600;
            white-space: nowrap;
        }

        #lb-counter {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, .4);
            font-size: 12px;
            letter-spacing: .2em;
            font-weight: 600;
        }

        .lb-close {
            position: absolute;
            top: 18px;
            right: 22px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s ease;
        }

        .lb-close:hover {
            background: rgba(255, 26, 26, .25);
            border-color: #FF1A1A;
            color: #FF1A1A;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s ease;
        }

        .lb-nav:hover {
            background: rgba(229, 184, 41, .2);
            border-color: #E5B829;
            color: #E5B829;
        }

        #lb-prev {
            left: 22px;
        }

        #lb-next {
            right: 22px;
        }
    </style>
</head>

<body>

    <!-- LIGHTBOX OVERLAY -->
    <div id="lightbox">
        <button class="lb-close" id="lb-close">&times;</button>
        <button class="lb-nav" id="lb-prev">&#8592;</button>
        <img id="lb-img" src="" alt="">
        <button class="lb-nav" id="lb-next">&#8594;</button>
        <div id="lb-caption"></div>
        <div id="lb-counter"></div>
    </div>

    <div class="header">
        <div class="nav-back">
            <a href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Back to Main Menu
            </a>
        </div>
        <h1>Freeweight <span>Floor</span></h1>
        <p>Premium olympic gear, free weights, and everything you need for serious lifting.</p>
    </div>

    <div class="gallery">
        <div class="gallery-item">
            <img src="images/freeweight-1.jpg" alt="Freeweight Floor">
            <div class="lb-hint"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 8v6M8 11h6" />
                </svg></div>
        </div>
        <div class="gallery-item">
            <img src="images/freeweight-2.jpg" alt="Barbells &amp; Racks">
            <div class="lb-hint"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 8v6M8 11h6" />
                </svg></div>
        </div>
        <div class="gallery-item">
            <img src="images/freeweight-3.jpg" alt="Dumbbell Rack">
            <div class="lb-hint"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 8v6M8 11h6" />
                </svg></div>
        </div>
        <div class="gallery-item">
            <img src="images/freeweight-4.jpg" alt="Weight Plates">
            <div class="lb-hint"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 8v6M8 11h6" />
                </svg></div>
        </div>
        <div class="gallery-item">
            <img src="images/freeweight-5.jpg" alt="Strength Training Area">
            <div class="lb-hint"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 8v6M8 11h6" />
                </svg></div>
        </div>
    </div>

    <script>
        const items = Array.from(document.querySelectorAll('.gallery-item'));
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');
        const lbCap = document.getElementById('lb-caption');
        const lbCnt = document.getElementById('lb-counter');
        let current = 0;

        function openLB(idx) {
            current = idx;
            const img = items[idx].querySelector('img');
            lbImg.src = img.src;
            lbImg.alt = img.alt;
            lbCap.textContent = img.alt;
            lbCnt.textContent = (idx + 1) + ' / ' + items.length;
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLB() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
        }

        function showPrev() { openLB((current - 1 + items.length) % items.length); }
        function showNext() { openLB((current + 1) % items.length); }

        items.forEach((item, i) => item.addEventListener('click', () => openLB(i)));
        document.getElementById('lb-close').addEventListener('click', closeLB);
        document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); showPrev(); });
        document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); showNext(); });
        lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });
        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') closeLB();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });
    </script>

</body>

</html>
