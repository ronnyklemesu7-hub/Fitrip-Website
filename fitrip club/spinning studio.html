<html doctype>
    <html lang="en">
        
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Boxing Floor Gallery - FITRIP FITNESS CLUB</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&display=swap"
            rel="stylesheet">
            <style>
                :root {
                    --black: #000000;
                    --charcoal: #141414;
                    --red: #FF1A1A;
                    --gold: #E5B829;
                    --white: #ffffff;
                }
    
                body {
                    font-family: 'Montserrat', sans-serif;
                    background: var(--black);
                    color: var(--white);
                    margin: 0;
                    padding: 0;
                }
    
                .header {
                    text-align: center;
                    padding: 30px 30px 40px;
                    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                    background: linear-gradient(180deg, var(--charcoal), var(--black));
                    position: relative;
                }
    
                .header h1 {
                    font-family: 'Anton', sans-serif;
                    font-size: clamp(40px, 6vw, 64px);
                    text-transform: uppercase;
                    letter-spacing: 0.05em;
                    margin: 30px 0 10px;
                    color: var(--white);
                }
    
                .header h1 span {
                    background: linear-gradient(135deg, var(--red) 0%, var(--gold) 100%);
                    -webkit-background-clip: text;
                    background-clip: text;
                    color: transparent;
                }
    
                .header p {
                    color: #aaa;
                    font-size: 16px;
                    margin: 0;
                }
    
                .gallery {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                    gap: 20px;
                    padding: 40px 5vw;
                    max-width: 1300px;
                    margin: 0 auto;
                }
    
                .gallery-item {
                    position: relative;
                    aspect-ratio: 4/3;
                    border-radius: 8px;
                    overflow: hidden;
                    cursor: pointer;
                }
    
                .gallery-item img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    transition: transform 0.5s ease, filter 0.5s ease;
                    filter: grayscale(30%);
                }
    
                .gallery-item:hover img {
                    transform: scale(1.05);
                    filter: grayscale(0%);
                }
    
                .gallery-item::after {
                    content: "";
                    position: absolute;
                    inset: 0;
                    background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.8) 100%);
                    pointer-events: none;
                }
    
                .nav-back {
                    position: absolute;
                    top: 24px;
                    left: 30px;
                }
    
                .nav-back a {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    color: var(--white);
                    text-decoration: none;
                    font-family: 'Montserrat', sans-serif;
                    font-weight: 600;
                    font-size: 13px;
                    letter-spacing: 0.1em;
                    text-transform: uppercase;
                    transition: color 0.3s ease;
                    opacity: 0.75;
                }
    
                .nav-back a:hover {
                    color: var(--gold);
                    opacity: 1;
                }
            </style>
        </head>


</html>
